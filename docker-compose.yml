# Single-GPU NInfer server on a Tesla V100.
#
#   mkdir -p models
#   hf download neroued/Qwen3.8-27B-nvfp4-NInfer qwen3_8_27b_nvfp4.ninfer \
#     --revision 11dbbbbbc33db198afe2f02c9232c771ff7031be --local-dir models
#   docker compose up -d
#
# Requires the NVIDIA Container Toolkit. Override any variable below in a .env file.
services:
  ninfer:
    image: ${NINFER_IMAGE:-ghcr.io/ddominet/ninfer-v100:latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${NINFER_PORT:-8080}:8080"
    volumes:
      - "${NINFER_MODELS:-./models}:/models:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NINFER_GPU:-0}"]
              capabilities: [gpu]
    command:
      - ninfer-serve
      - /models/${NINFER_MODEL:-qwen3_8_27b_nvfp4.ninfer}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --max-context
      - "${NINFER_MAX_CONTEXT:-262144}"
      - --kv-capacity
      - "${NINFER_KV_CAPACITY:-262144}"
      - --kv-dtype
      - int8
      - --max-concurrency
      - "${NINFER_MAX_CONCURRENCY:-8}"
      - --device-state-slots
      - "0"
      - --host-state-slots
      - "16"
      - --host-kv-mib
      - "6144"
      - --prefill-chunk
      - "2048"
      - --spec
      - mtp
      - --draft-tokens
      - "${NINFER_DRAFT_TOKENS:-3}"
      - --lm-head-draft
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
